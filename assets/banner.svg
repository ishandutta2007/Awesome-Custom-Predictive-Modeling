<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatPulse {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.6; }
        50% { transform: translateY(-8px) scale(1.05); opacity: 0.9; }
      }
      @keyframes waveDrift {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-30px); }
        100% { transform: translateX(0px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes nodeGlow {
        0%, 100% { r: 4px; opacity: 0.5; }
        50% { r: 6.5px; opacity: 1; }
      }
      .wave-line {
        animation: waveDrift 10s ease-in-out infinite;
      }
      .pulse-node {
        animation: nodeGlow 4s ease-in-out infinite;
      }
      .flow-stream {
        stroke-dasharray: 6, 8;
        animation: dashMove 6s linear infinite;
      }
      .badge-glow {
        animation: floatPulse 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Geometric Sci-Fi Grid -->
  <g opacity="0.4">
    <line x1="0" y1="70" x2="1200" y2="70" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,8" />
    <line x1="0" y1="140" x2="1200" y2="140" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,8" />
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,8" />
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,8" />
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,8" />

    <line x1="150" y1="0" x2="150" y2="420" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,8" />
    <line x1="350" y1="0" x2="350" y2="420" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,8" />
    <line x1="550" y1="0" x2="550" y2="420" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,8" />
    <line x1="750" y1="0" x2="750" y2="420" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,8" />
    <line x1="950" y1="0" x2="950" y2="420" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,8" />
    <line x1="1100" y1="0" x2="1100" y2="420" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,8" />
  </g>

  <!-- Ambient Backdrop Glow Spots (Safely in background) -->
  <circle cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1050" cy="300" r="180" fill="#a855f7" opacity="0.1" filter="url(#glow)" />
  <circle cx="600" cy="380" r="160" fill="#6366f1" opacity="0.07" filter="url(#glow)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Lower Layer) -->
  <!-- Predictive Regression Curves & Dynamic Machine Learning Waveforms -->
  <g class="wave-line">
    <path d="M -50,330 Q 180,240 380,310 T 780,270 T 1150,350 T 1300,290" 
          fill="none" stroke="url(#waveGrad)" stroke-width="2.5" opacity="0.65" />
    <path d="M -50,360 Q 220,290 440,350 T 840,300 T 1180,380" 
          fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" stroke-dasharray="6,6" />
  </g>

  <!-- Animated Data Flow Line (dashed) -->
  <path d="M 0,380 Q 300,320 600,360 T 1200,310" 
        class="flow-stream" fill="none" stroke="#818cf8" stroke-width="1.8" opacity="0.55" />

  <!-- Dynamic Data Node Anchors & Prediction Confidence Cones -->
  <g id="scatter-nodes">
    <!-- Trend points with soft pulse -->
    <circle cx="180" cy="275" r="4" fill="#38bdf8" class="pulse-node" filter="url(#softGlow)" />
    <circle cx="290" cy="290" r="3.5" fill="#818cf8" />
    <circle cx="430" cy="315" r="5" fill="#38bdf8" class="pulse-node" style="animation-delay: 1s;" />
    <circle cx="580" cy="285" r="4.5" fill="#c084fc" class="pulse-node" style="animation-delay: 2s;" filter="url(#softGlow)" />
    <circle cx="720" cy="278" r="4" fill="#38bdf8" />
    <circle cx="880" cy="305" r="5.5" fill="#f43f5e" class="pulse-node" style="animation-delay: 1.5s;" filter="url(#softGlow)" />
    <circle cx="1020" cy="340" r="4.5" fill="#38bdf8" />
    <circle cx="1120" cy="315" r="5" fill="#818cf8" class="pulse-node" style="animation-delay: 2.5s;" />

    <!-- Feature Connection lines -->
    <line x1="180" y1="275" x2="290" y2="290" stroke="#38bdf8" stroke-width="0.8" opacity="0.4" />
    <line x1="290" y1="290" x2="430" y2="315" stroke="#818cf8" stroke-width="0.8" opacity="0.4" />
    <line x1="430" y1="315" x2="580" y2="285" stroke="#818cf8" stroke-width="0.8" opacity="0.4" />
    <line x1="580" y1="285" x2="720" y2="278" stroke="#c084fc" stroke-width="0.8" opacity="0.4" />
    <line x1="720" y1="278" x2="880" y2="305" stroke="#f43f5e" stroke-width="0.8" opacity="0.4" />
    <line x1="880" y1="305" x2="1020" y2="340" stroke="#818cf8" stroke-width="0.8" opacity="0.4" />
    <line x1="1020" y1="340" x2="1120" y2="315" stroke="#38bdf8" stroke-width="0.8" opacity="0.4" />
  </g>

  <!-- Dynamic Forecast Confidence Interval Fan (Bottom right corner) -->
  <path d="M 880,305 L 1150,260 L 1150,380 Z" fill="url(#glowGrad)" opacity="0.35" />
  <line x1="880" y1="305" x2="1150" y2="260" stroke="#c084fc" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
  <line x1="880" y1="305" x2="1150" y2="380" stroke="#c084fc" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

  <!-- FOREGROUND CONTENT: High clarity, robust contrast, guaranteed legibility -->

  <!-- Top Pill / Status Tag -->
  <g transform="translate(60, 48)">
    <rect width="265" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <circle cx="16" cy="15" r="4.5" fill="#10b981" filter="url(#softGlow)" />
    <text x="30" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Repository Main Title -->
  <text x="60" y="128" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
    Awesome Custom Predictive Modeling
  </text>

  <!-- Subtitle with Gradient Accent -->
  <text x="60" y="168" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0">
    AutoML • Automated Feature Engineering • Production Model Deployment
  </text>

  <!-- Description / Meta text -->
  <text x="60" y="202" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">
    Enterprise SaaS platforms, benchmarks, pricing tiers &amp; top-tier open-source machine learning frameworks.
  </text>

  <!-- Interactive Badges & Architectural Highlights (Middle/Foreground) -->
  <g transform="translate(60, 230)">
    <!-- Badge 1: AutoML -->
    <g transform="translate(0, 0)">
      <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="18" y="21" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">⚡ AutoML</text>
    </g>

    <!-- Badge 2: Feature Synthesis -->
    <g transform="translate(142, 0)">
      <rect width="185" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="18" y="21" fill="#818cf8" font-family="sans-serif" font-size="13" font-weight="700">🧬 Feature Synthesis</text>
    </g>

    <!-- Badge 3: MLOps & Serving -->
    <g transform="translate(339, 0)">
      <rect width="175" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="18" y="21" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="700">🚀 MLOps &amp; Serving</text>
    </g>

    <!-- Badge 4: Explainability -->
    <g transform="translate(526, 0)">
      <rect width="165" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="18" y="21" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="700">🔍 Explainability</text>
    </g>
  </g>

  <!-- Bottom Accent Strip -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#primaryGrad)" />
</svg>
